name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Valores fake so pra Settings() conseguir instanciar nos testes (ver
      # app/core/config.py - esses campos nao tem default). Nao sao segredos reais,
      # tests/unit nunca conecta num banco/LLM de verdade (SQLite em memoria).
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_ci
      GROQ_API_KEY: test-key-nao-usado-em-testes-unitarios
      JWT_SECRET: test-secret-nao-usado-em-producao
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: uv sync --all-groups
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Testes unitários (sem banco/LLM real)
        run: uv run pytest tests/unit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build (confirma que compila/tipa certo)
        run: npm run build
